<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamLinux Indonesia - Join</title>
    <link rel="stylesheet" href="join.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4 shadow-sm mb-4">
        <div class="container">
            <h1 class="display-5 fw-bold">Gabung ke TeamLinux Indonesia</h1>
            <p class="lead text-secondary mb-0">Jadilah bagian dari komunitas open-source Linux di Indonesia</p>
        </div>
    </header>

    <!-- Menu -->
    <div class="container mb-4">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded shadow-sm px-3">
            <span class="navbar-brand mb-0 h1 d-lg-none">Menu</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav w-100 justify-content-around">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="distro.html">Distro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="join.html">Join</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="member.html">Member</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
    <main class="container flex-grow-1 mb-5">
        <form action="#" method="post">
            <div class="row g-4">

                <!-- Identitas Anggota -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body p-4">
                            <h2 class="card-title h4 text-primary fw-bold mb-4">Identitas Anggota</h2>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama User</label>
                                <input type="text" class="form-control" placeholder="Masukkan nama lengkap Anda">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Email</label>
                                <input type="email" class="form-control" placeholder="contoh@domain.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password Email</label>
                                <input type="password" class="form-control" placeholder="••••••••">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="male" name="gender" value="pria">
                                    <label class="form-check-label" for="male">Pria</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="female" name="gender"
                                        value="wanita">
                                    <label class="form-check-label" for="female">Wanita</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pengalaman Distro Linux -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body p-4 d-flex flex-column justify-content-between">
                            <div>
                                <h2 class="card-title h4 text-primary fw-bold mb-4">Pengalaman Distro Linux</h2>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Basis Distro Favorit</label>
                                    <select class="form-select">
                                        <option selected disabled>-- Pilih --</option>
                                        <option>Debian</option>
                                        <option>Fedora</option>
                                        <option>Arch</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Distro Linux Favorit</label>
                                    <input type="text" class="form-control"
                                        placeholder="Contoh: Arch, Ubuntu, Fedora...">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Lama Penggunaan Linux</label>
                                    <select class="form-select">
                                        <option selected disabled>-- Pilih --</option>
                                        <option>Kurang dari 1 tahun</option>
                                        <option>1 - 3 tahun</option>
                                        <option>Lebih dari 3 tahun</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold d-block">Keterampilan</label>
                                    <div class="row row-cols-2 g-2">
                                        <div class="col">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="skillScripting">
                                                <label class="form-check-label" for="skillScripting">Scripting</label>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="skillServer">
                                                <label class="form-check-label" for="skillServer">Server</label>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="skillRicing">
                                                <label class="form-check-label" for="skillRicing">Ricing</label>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="skillSoftDev">
                                                <label class="form-check-label" for="skillSoftDev">SoftDev</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Daftar
                                Sekarang</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 border-top mt-auto text-muted">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 TeamLinux Indonesia. Dibuat oleh <strong>Rafael Putra Septava</strong>
                pada <time>30 September 2026</time>.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
