<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamLinux Indonesia - Join</title>
    <link rel="stylesheet" href="join.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex flex-col min-h-full text-gray-800">

    <!-- Header -->
    <header class="bg-gray-900 text-white text-center py-6 shadow-sm mb-6">
        <div class="container mx-auto px-4">
            <h1 class="text-4xl font-bold tracking-tight">Gabung ke TeamLinux Indonesia</h1>
            <p class="text-lg text-gray-400 mt-1 mb-0">Jadilah bagian dari komunitas open-source Linux di Indonesia</p>
        </div>
    </header>

    <!-- Menu -->
    <div class="container mx-auto px-4 mb-6">
        <nav class="bg-blue-600 rounded-lg shadow-sm px-4 py-3">
            <div class="flex flex-wrap items-center justify-between">
                <span class="text-white font-bold text-lg lg:hidden">Menu</span>
                <!-- Mobile Responsif -->
                <button id="navbar-toggler"
                    class="lg:hidden text-white focus:outline-none p-1 rounded hover:bg-blue-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div id="navbarNav" class="hidden lg:flex w-full lg:w-auto items-center justify-between mt-3 lg:mt-0">
                    <ul class="flex flex-col lg:flex-row w-full justify-around items-center gap-2 lg:gap-0">
                        <li class="w-full lg:w-auto text-center">
                            <a class="text-white/80 hover:text-white px-4 py-2 rounded hover:bg-blue-700 transition block"
                                href="index.html">Beranda</a>
                        </li>
                        <li class="w-full lg:w-auto text-center">
                            <a class="text-white/80 hover:text-white px-4 py-2 rounded hover:bg-blue-700 transition block"
                                href="distro.html">Distro</a>
                        </li>
                        <li class="w-full lg:w-auto text-center">
                            <a class="text-white font-semibold px-4 py-2 rounded bg-blue-700 lg:bg-transparent block"
                                href="join.html">Join</a>
                        </li>
                        <li class="w-full lg:w-auto text-center">
                            <a class="text-white/80 hover:text-white px-4 py-2 rounded hover:bg-blue-700 transition block"
                                href="member.html">Member</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <main class="container mx-auto px-4 flex-grow mb-12">
        <form action="#" method="post">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">

                <!-- Identitas Anggota -->
                <section class="h-full">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 h-full">
                        <h2 class="text-xl font-bold text-blue-600 mb-6">Identitas Anggota</h2>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-semibold mb-2">Nama User</label>
                            <input type="text"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Masukkan nama lengkap Anda">
                        </div>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-semibold mb-2">Nama Email</label>
                            <input type="email"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="contoh@domain.com">
                        </div>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-semibold mb-2">Password Email</label>
                            <input type="password"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="••••••••">
                        </div>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-semibold mb-2">Gender</label>
                            <div class="flex items-center space-x-6">
                                <label class="inline-flex items-center cursor-pointer">
                                    <input type="radio" id="male" name="gender" value="pria"
                                        class="text-blue-600 focus:ring-blue-500">
                                    <span class="ml-2 text-gray-700">Pria</span>
                                </label>
                                <label class="inline-flex items-center cursor-pointer">
                                    <input type="radio" id="female" name="gender" value="wanita"
                                        class="text-blue-600 focus:ring-blue-500">
                                    <span class="ml-2 text-gray-700">Wanita</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Pengalaman Distro Linux -->
                <section class="h-full">
                    <div
                        class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 h-full flex flex-col justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-blue-600 mb-6">Pengalaman Distro Linux</h2>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-semibold mb-2">Basis Distro Favorit</label>
                                <select
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                    <option selected disabled>-- Pilih --</option>
                                    <option>Debian</option>
                                    <option>Fedora</option>
                                    <option>Arch</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-semibold mb-2">Distro Linux Favorit</label>
                                <input type="text"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    placeholder="Contoh: Arch, Ubuntu, Fedora...">
                            </div>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-semibold mb-2">Lama Penggunaan Linux</label>
                                <select
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                    <option selected disabled>-- Pilih --</option>
                                    <option>Kurang dari 1 tahun</option>
                                    <option>1 - 3 tahun</option>
                                    <option>Lebih dari 3 tahun</option>
                                </select>
                            </div>

                            <div class="mb-6">
                                <label class="block text-gray-700 font-semibold mb-2">Keterampilan</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="skillScripting"
                                            class="rounded text-blue-600 focus:ring-blue-500">
                                        <span class="ml-2 text-gray-700">Scripting</span>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="skillServer"
                                            class="rounded text-blue-600 focus:ring-blue-500">
                                        <span class="ml-2 text-gray-700">Server</span>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="skillRicing"
                                            class="rounded text-blue-600 focus:ring-blue-500">
                                        <span class="ml-2 text-gray-700">Ricing</span>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="skillSoftDev"
                                            class="rounded text-blue-600 focus:ring-blue-500">
                                        <span class="ml-2 text-gray-700">SoftDev</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-md shadow-sm transition duration-150">Daftar
                            Sekarang</button>
                    </div>
                </section>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 border-t border-gray-200 mt-auto text-gray-500">
        <div class="container mx-auto px-4">
            <p class="text-sm mb-0">&copy; 2026 TeamLinux Indonesia. Dibuat oleh <strong class="text-gray-700">Rafael
                    Putra Septava</strong> pada
                <time>30 September 2026</time>.
            </p>
        </div>
    </footer>

    <script>
        const toggler = document.getElementById('navbar-toggler');
        const navMenu = document.getElementById('navbarNav');
        toggler.addEventListener('click', () => {
            navMenu.classList.toggle('hidden');
        });
    </script>
</body>

</html>
