
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Booking - Grand Luxora Hotel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="container-fluid px-4 px-lg-5 py-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <a href="index.html" class="navbar-brand hotel-logo">
          <i class="bi bi-building"></i> Grand Luxora
        </a>

        <div class="d-flex flex-wrap gap-3 gap-lg-4">
          <a href="index.html" class="nav-link">
            <i class="bi bi-house-door"></i> Home
          </a>
          <a href="rooms.html" class="nav-link">
            <i class="bi bi-door-open"></i> Rooms
          </a>
          <a href="reservation.html" class="nav-link">
            <i class="bi bi-calendar-check"></i> Reservation
          </a>
          <a href="booking.html" class="nav-link active">
            <i class="bi bi-person-circle"></i> My Booking
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- PAGE HEADER -->
  <section class="page-header text-center">
    <h1>My Booking</h1>
    <p>Detail reservasi Anda.</p>
  </section>

  <!-- BOOKING CONTENT -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7">

        <div class="card hotel-card text-center p-4 p-md-5">
          <div class="card-body">
            <i class="bi bi-calendar-x booking-icon"></i>

            <h2 class="section-title mt-3">
              Belum Ada Booking
            </h2>

            <p class="text-secondary my-4">
              Silakan lakukan reservasi terlebih dahulu.
            </p>

            <a href="reservation.html" class="btn btn-gold">
              Buat Reservasi
              <i class="bi bi-arrow-right ms-2"></i>
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
