
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation - Grand Luxora Hotel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="container-fluid px-4 px-lg-5 py-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <a href="index.html" class="navbar-brand hotel-logo">
          <i class="bi bi-building"></i> Grand Luxora
        </a>

        <div class="d-flex flex-wrap gap-3 gap-lg-4">
          <a href="index.html" class="nav-link">
            <i class="bi bi-house-door"></i> Home
          </a>
          <a href="rooms.html" class="nav-link">
            <i class="bi bi-door-open"></i> Rooms
          </a>
          <a href="reservation.html" class="nav-link active">
            <i class="bi bi-calendar-check"></i> Reservation
          </a>
          <a href="booking.html" class="nav-link">
            <i class="bi bi-person-circle"></i> My Booking
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- PAGE HEADER -->
  <section class="page-header text-center">
    <h1>Reservation</h1>
    <p>Isi data untuk melakukan pemesanan kamar.</p>
  </section>

  <!-- RESERVATION FORM -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7">

        <div class="card hotel-card p-4 p-md-5">
          <div class="card-body">

            <form action="#" method="get">

              <!-- NAMA -->
              <div class="mb-4">
                <label for="name" class="form-label">
                  Nama Lengkap
                </label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="Masukkan nama"
                       required>
              </div>

              <!-- TELEPON -->
              <div class="mb-4">
                <label for="phone" class="form-label">
                  Nomor Telepon
                </label>
                <input type="tel"
                       class="form-control"
                       id="phone"
                       name="phone"
                       placeholder="Masukkan nomor"
                       required>
              </div>

              <!-- PILIH KAMAR -->
              <div class="mb-4">
                <label for="room" class="form-label">
                  Pilih Kamar
                </label>
                <select class="form-select" id="room" name="room">
                  <option value="deluxe">
                    Deluxe Room - Rp500.000
                  </option>
                  <option value="suite">
                    Suite Room - Rp900.000
                  </option>
                  <option value="family">
                    Family Room - Rp1.200.000
                  </option>
                </select>
              </div>

              <!-- TANGGAL -->
              <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="checkin" class="form-label">
                    Check In
                  </label>
                  <input type="date"
                         class="form-control"
                         id="checkin"
                         name="checkin"
                         required>
                </div>

                <div class="col-md-6">
                  <label for="checkout" class="form-label">
                    Check Out
                  </label>
                  <input type="date"
                         class="form-control"
                         id="checkout"
                         name="checkout"
                         required>
                </div>
              </div>

              <!-- JUMLAH TAMU -->
              <div class="mb-4">
                <label for="guest" class="form-label">
                  Jumlah Tamu
                </label>
                <input type="number"
                       class="form-control"
                       id="guest"
                       name="guest"
                       min="1"
                       value="1"
                       required>
              </div>

              <!-- TOTAL HARGA -->
              <div class="price-box mb-4">
                <h5 class="fw-semibold">Total Harga</h5>

                <h3 class="gold-text">Rp0</h3>

                <p class="text-secondary mb-0 small">
                  Total harga akan dihitung saat pemesanan diproses.
                </p>
              </div>

              <!-- BUTTON -->
              <button type="submit" class="btn btn-gold w-100">
                Confirm Booking
                <i class="bi bi-check-circle ms-2"></i>
              </button>

            </form>

          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
