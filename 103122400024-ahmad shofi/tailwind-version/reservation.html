<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation - Grand Luxora Hotel</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#c9a227',
            cream: '#faf8f3',
            charcoal: '#1c1c1c'
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            playfair: ['Playfair Display', 'serif']
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' }
            }
          },
          animation: {
            float: 'float 3s ease-in-out infinite'
          }
        }
      }
    };
  </script>
</head>

<body class="bg-cream font-poppins text-[#222] antialiased">

  <!-- NAVBAR -->
  <header class="relative z-50">
    <nav class="navbar relative flex items-center justify-between bg-white px-[8%] py-5 shadow-[0_5px_20px_rgba(0,0,0,0.08)] transition-all duration-[400ms]">

      <a href="index.html" class="flex items-center gap-2 font-playfair text-[23px] font-bold text-gold sm:text-[28px]">
        <i class="bi bi-building animate-float"></i>
        <span>Grand Luxora</span>
      </a>

      <button id="menuToggle" type="button"
              class="text-3xl text-gold md:hidden"
              aria-label="Buka menu navigasi"
              aria-controls="navMenu"
              aria-expanded="false">
        <i class="bi bi-list"></i>
      </button>

      <ul id="navMenu"
          class="absolute left-0 top-full hidden w-full flex-col items-center gap-5 bg-white px-5 py-6 shadow-lg md:static md:flex md:w-auto md:flex-row md:gap-[35px] md:bg-transparent md:p-0 md:shadow-none">

        <li>
          <a href="index.html" class="text-[#333] text-[15px] transition-colors hover:text-gold">
            <i class="bi bi-house-door mr-1"></i> Home
          </a>
        </li>

        <li>
          <a href="rooms.html" class="text-[#333] text-[15px] transition-colors hover:text-gold">
            <i class="bi bi-door-open mr-1"></i> Rooms
          </a>
        </li>

        <li>
          <a href="reservation.html" class="font-medium text-gold text-[15px]">
            <i class="bi bi-calendar-check mr-1"></i> Reservation
          </a>
        </li>

        <li>
          <a href="booking.html" class="text-[#333] text-[15px] transition-colors hover:text-gold">
            <i class="bi bi-person-circle mr-1"></i> My Booking
          </a>
        </li>

      </ul>
    </nav>
  </header>

  <!-- PAGE HEADER -->
  <section class="bg-charcoal px-[8%] py-[70px] text-center text-white">

    <h1 class="font-playfair text-[40px] font-bold sm:text-[50px]">
      Reservation
    </h1>

    <p class="mt-2 text-sm text-gray-300 sm:text-base">
      Isi data untuk melakukan pemesanan kamar.
    </p>

  </section>

  <!-- RESERVATION FORM -->
  <main class="flex justify-center px-[8%] py-20">

    <div class="w-full max-w-[600px] rounded-[20px] bg-white p-6 shadow-sm sm:p-10">

      <form id="bookingForm" class="space-y-5">

        <!-- NAMA -->
        <div>
          <label for="name" class="mb-2 block font-medium">
            Nama Lengkap
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Masukkan nama"
            autocomplete="name"
            required
            class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
          >
        </div>

        <!-- TELEPON -->
        <div>
          <label for="phone" class="mb-2 block font-medium">
            Nomor Telepon
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Masukkan nomor"
            autocomplete="tel"
            inputmode="tel"
            required
            class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
          >
        </div>

        <!-- PILIH KAMAR -->
        <div>
          <label for="room" class="mb-2 block font-medium">
            Pilih Kamar
          </label>

          <select
            id="room"
            name="room"
            class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
          >
            <option value="500000">
              Deluxe Room - Rp500.000
            </option>

            <option value="900000">
              Suite Room - Rp900.000
            </option>

            <option value="1200000">
              Family Room - Rp1.200.000
            </option>
          </select>
        </div>

        <!-- DATE -->
        <div class="flex flex-col gap-5 sm:flex-row">

          <div class="w-full sm:w-1/2">
            <label for="checkin" class="mb-2 block font-medium">
              Check In
            </label>

            <input
              type="date"
              id="checkin"
              name="checkin"
              required
              class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
            >
          </div>

          <div class="w-full sm:w-1/2">
            <label for="checkout" class="mb-2 block font-medium">
              Check Out
            </label>

            <input
              type="date"
              id="checkout"
              name="checkout"
              required
              class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
            >
          </div>

        </div>

        <!-- JUMLAH TAMU -->
        <div>
          <label for="guest" class="mb-2 block font-medium">
            Jumlah Tamu
          </label>

          <input
            type="number"
            id="guest"
            name="guest"
            min="1"
            value="1"
            required
            class="w-full rounded-lg border border-[#ddd] bg-white px-3 py-3 outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/20"
          >
        </div>

        <!-- TOTAL -->
        <div class="rounded-xl bg-cream p-5">

          <h3 class="font-semibold">
            Total Harga
          </h3>

          <p
            id="totalPrice"
            class="mt-1 text-[28px] font-semibold text-gold"
            aria-live="polite"
          >
            Rp0
          </p>

          <p id="nightInfo" class="text-sm text-gray-500">
            Pilih tanggal check in dan check out
          </p>

        </div>

        <p
          id="formError"
          class="hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"
          role="alert"
        ></p>

        <!-- BUTTON -->
        <button
          type="submit"
          class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-gold px-[35px] py-[14px] font-medium text-white shadow-[0_10px_20px_rgba(201,162,39,0.35)] transition-all duration-300 hover:-translate-y-1 hover:scale-105 hover:bg-[#b8921e]"
        >
          Confirm Booking
          <i class="bi bi-check-circle"></i>
        </button>

      </form>
    </div>

  </main>

  <script src="js/script.js"></script>
  <script src="js/reservation.js"></script>

</body>
</html>
