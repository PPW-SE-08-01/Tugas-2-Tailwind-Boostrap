
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Data Penduduk</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Tabel Data Penduduk</h2>

    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-primary">
                <tr>
                    <th>No</th>
                    <th>Nama Lengkap</th>
                    <th>Desa</th>
                    <th>Kecamatan</th>
                    <th>Kabupaten</th>
                    <th>Umur</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Prabowo</td>
                    <td>Karanganyar</td>
                    <td>Purwokerto Selatan</td>
                    <td>Banyumas</td>
                    <td>65 tahun</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Teddy</td>
                    <td>Kedungwuluh</td>
                    <td>Purwokerto Barat</td>
                    <td>Banyumas</td>
                    <td>80 tahun</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Gibram</td>
                    <td>Arcawinangun</td>
                    <td>Purwokerto Timur</td>
                    <td>Banyumas</td>
                    <td>19 tahun</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
